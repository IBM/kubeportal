---
# Source: kubeportal-hub/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeportal-hub
  labels:
    helm.sh/chart: kubeportal-hub-0.1.0
    app.kubernetes.io/name: kubeportal-hub
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeportal-hub
      app.kubernetes.io/instance: release-name
  template:
    metadata:
      labels:
        helm.sh/chart: kubeportal-hub-0.1.0
        app.kubernetes.io/name: kubeportal-hub
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: kubeportal-hub
      automountServiceAccountToken: true
      volumes:
        - name: openid-ca-certs
          configMap:
            name: kubeportal-openid-ca-certs
            optional: true
      containers:
        - name: kubeportal-hub
          image: "quay.io/ibm/kubeportal:latest"
          imagePullPolicy: IfNotPresent
          args:
            - hub
          env:
            - name: LOG_LEVEL
              value: "debug"
            - name: AGENT_LISTEN_PORT
              value: "9443"
            - name: CLIENT_LISTEN_PORT
              value: "8443"
            - name: OPENID_CA_CERTS_PATH
              value: "/etc/openid-ca-certs"
          ports:
            - name: agents
              containerPort: 9443
              protocol: TCP
            - name: clients
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: openid-ca-certs
              mountPath: /etc/openid-ca-certs
              readOnly: true
